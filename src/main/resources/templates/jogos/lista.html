<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Jogos')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('Jogos', ~{::main})}">
<main class="page-body"><div class="container-xl">
    <div class="page-header d-print-none mb-3"><div class="row align-items-center"><div class="col"><div class="page-pretitle">Catálogo</div><h2 class="page-title">Jogos</h2><div class="text-secondary mt-1">Gerencie os títulos, gêneros e plataformas disponíveis.</div></div><div class="col-auto ms-auto"><a th:href="@{/jogos/novo}" class="btn btn-primary">Novo jogo</a></div></div></div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div class="card mb-3"><div class="card-header"><h3 class="card-title">Pesquisar jogos</h3></div><div class="card-body"><form th:action="@{/jogos}" method="get" class="row g-2 align-items-end"><div class="col-12 col-lg-8"><label class="form-label" for="pesquisa">Título, gênero ou plataforma</label><input id="pesquisa" name="pesquisa" class="form-control" type="search" th:value="${pesquisa}" placeholder="Digite para pesquisar"></div><div class="col-auto"><button class="btn btn-primary">Pesquisar</button></div><div class="col-auto"><a th:href="@{/jogos}" class="btn btn-outline-secondary">Limpar</a></div></form></div></div>
    <div class="card"><div class="card-header"><h3 class="card-title">Jogos cadastrados</h3><div class="card-actions text-secondary" th:text="${#lists.size(jogos)} + ' registro(s)'"></div></div><div class="table-responsive"><table class="table table-vcenter card-table table-hover"><thead><tr><th>ID</th><th>Título</th><th>Ano</th><th>Classificação</th><th>Gênero</th><th>Plataformas</th><th class="w-1">Ações</th></tr></thead><tbody>
        <tr th:each="jogo : ${jogos}"><td class="text-secondary" th:text="${jogo.idJogo()}">1</td><td class="fw-semibold" th:text="${jogo.titulo()}">Jogo</td><td th:text="${jogo.anoLancamento()}">2025</td><td><span class="badge bg-blue-lt" th:text="${jogo.classificacaoIndicativa()}">LIVRE</span></td><td th:text="${jogo.nomeGenero()}">Gênero</td><td th:text="${jogo.nomesPlataformas()}">Plataformas</td><td><div class="btn-list flex-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{|/jogos/${jogo.idJogo()}/editar|}">Editar</a><form th:if="${podeExcluir}" th:action="@{|/jogos/${jogo.idJogo()}/excluir|}" method="post" class="m-0" onsubmit="return confirm('Confirma a exclusão deste jogo?');"><button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button></form></div></td></tr>
        <tr th:if="${#lists.isEmpty(jogos)}"><td colspan="7"><div class="empty py-4"><p class="empty-title">Nenhum jogo encontrado</p><p class="empty-subtitle text-secondary">Altere a pesquisa ou cadastre um jogo.</p><div class="empty-action"><a th:href="@{/jogos/novo}" class="btn btn-primary">Cadastrar jogo</a></div></div></td></tr>
    </tbody></table></div></div>
</div></main></div></body></html>
